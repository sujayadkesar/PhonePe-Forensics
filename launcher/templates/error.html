{% extends "base.html" %}
{% block heading %}{{ code or 502 }}{% endblock %}

{% block content %}
<div class="bar"><a class="back" href="{{ url_for('home') }}">&larr; Launcher</a></div>
<div class="card">

</div>
{% endblock %}
